# Release InfinityCod — publication commerciale complète (job unique).
#
# Déclenché par un tag v* : gate version → lint → audits → scan secrets →
# build (zip + sha256 + update.json) → release interne (sources privées) →
# publication sur le dépôt PUBLIC infinitycod-releases (mises à jour clients).
#
# Secret requis (une seule fois) :
#   RELEASES_TOKEN — GitHub token avec scope repo sur
#   derouicheoussama/infinitycod-releases (publication croisée uniquement).
#
# NB : job unique volontaire (pas d'artefacts inter-jobs) afin de ne pas
# consommer le quota de stockage d'artefacts GitHub.
name: Release InfinityCod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PHP 8.2 + sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium
          coverage: none

      - name: Dépendances
        run: npm ci || npm install

      - name: Vérification version (tag = header = constante)
        run: node tools/version.js --check "${{ github.ref_name }}"

      - name: PHP lint
        run: node tools/lint-php.js

      - name: Autoloader
        run: node tools/smoke.js

      - name: Harnais d'activation (PHP réel + sodium)
        run: php tools/test-activation.php

      - name: Audits qualité
        run: node tools/audit.js && node tools/audit-settings.js

      - name: Attribution check
        run: node tools/check-attribution.js

      - name: Scan secrets
        run: |
          ! grep -rEn "sk_live_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA )?PRIVATE KEY" infinitycod/

      - name: Build (zip + sha256 + manifest)
        run: node tools/build.js

      - name: Signature du manifest update.json (Ed25519)
        env:
          INFINITYCOD_SIGNING_KEY: ${{ secrets.INFINITYCOD_SIGNING_KEY }}
        if: env.INFINITYCOD_SIGNING_KEY != ''
        run: node tools/sign-update.js

      - name: Release interne (dépôt privé des sources)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/infinitycod.zip
            dist/infinitycod.zip.sha256
            dist/update.json
            dist/update.json.sig
          generate_release_notes: true

      - name: Release publique (dépôt des mises à jour clients)
        if: env.RELEASES_TOKEN != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          repository: derouicheoussama/infinitycod-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: InfinityCod ${{ github.ref_name }}
          body: 'Mise à jour WordPress : Extensions → Mettre à jour (ou automatique).'
          files: |
            dist/infinitycod.zip
            dist/infinitycod.zip.sha256
            dist/update.json
            dist/update.json.sig
