# Publie automatiquement une release à chaque tag v* :
# 1. Release dans CE dépôt (sources privées)
# 2. Release dans le dépôt PUBLIC derouicheoussama/infinitycod-releases
#    (source des mises à jour des boutiques clientes — sans token chez eux)
name: Release InfinityCod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dépendances
        run: npm ci || npm install

      - name: Vérifications (lint PHP + autoloader)
        run: node tools/lint-php.js && node tools/smoke.js

      - name: Construction du zip
        run: node tools/build.js

      - name: Release interne (dépôt privé des sources)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/infinitycod.zip
          generate_release_notes: true

      - name: Release publique (dépôt des mises à jour clients)
        if: env.RELEASES_TOKEN != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: derouicheoussama/infinitycod-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: InfinityCod ${{ github.ref_name }}
          body: 'Mise à jour WordPress : Extensions → Mettre à jour (ou automatique).'
          files: dist/infinitycod.zip
