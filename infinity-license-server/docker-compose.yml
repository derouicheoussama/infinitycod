services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      - ils-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
volumes:
  ils-storage:
